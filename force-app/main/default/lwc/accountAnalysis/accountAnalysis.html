<template>
    <div class="app-shell">
        <lightning-tabset>
            <lightning-tab value="dealSourcing" label="Deal Sourcing">
                <div class="header-row slds-m-bottom_large">
                    <div class="header-left">
                        <h1 class="page-title">Principal Deal Desk</h1>
                        <p class="page-subtitle">Get instant insights for investment committee preparation and transaction execution</p>
                    </div>
                    <div class="quick-start-card">
                        <p class="quick-start-title">Quick Start</p>
                        <div class="quick-start-item">
                            <lightning-icon icon-name="utility:search" size="xx-small"></lightning-icon>
                            <span>Pick an account below</span>
                        </div>
                        <div class="quick-start-item">
                            <lightning-icon icon-name="utility:einstein" size="xx-small"></lightning-icon>
                            <span>Agentforce analysis starts automatically</span>
                        </div>
                        <div class="quick-start-item">
                            <lightning-icon icon-name="utility:sparkles" size="xx-small"></lightning-icon>
                            <span>Explore insights in seconds</span>
                        </div>
                    </div>
                </div>

                <div class="search-section slds-m-bottom_large">
                    <lightning-input
                        class="editorial-search"
                        label="Select Target Account"
                        placeholder="Type account name to search..."
                        onchange={handleSearchInput}
                        value={searchTerm}>
                    </lightning-input>
                    <template lwc:if={searchResults}>
                        <div class="search-results">
                            <template for:each={searchResults} for:item="account">
                                <div key={account.Id}
                                     class="result-item"
                                     data-id={account.Id}
                                     data-name={account.Name}
                                     onclick={handleAccountSelect}>
                                    <p class="result-name">{account.Name}</p>
                                    <p class="result-meta">{account.Industry} · {account.BillingCity}</p>
                                </div>
                            </template>
                        </div>
                    </template>
                    <template lwc:if={selectedAccountName}>
                        <div class="selected-chip">
                            <span>{selectedAccountName}</span>
                            <div class="chip-clear-btn">
                                <lightning-button
                                    icon-name="utility:close"
                                    variant="base"
                                    onclick={clearSelection}>
                                </lightning-button>
                            </div>
                        </div>
                    </template>
                </div>

                <template lwc:if={selectedAccountId}>
                    <div class="slds-grid slds-gutters">
                        <div class="slds-col slds-size_1-of-2">
                            <c-relationship-health account-id={selectedAccountId}></c-relationship-health>
                        </div>
                        <div class="slds-col slds-size_1-of-2">
                            <c-account-research account-id={selectedAccountId}></c-account-research>
                        </div>
                    </div>
                    <div class="slds-m-top_large">
                        <c-meeting-prep-brief account-id={selectedAccountId}></c-meeting-prep-brief>
                    </div>
                </template>
            </lightning-tab>
            <lightning-tab value="portfolioReview" label="Portfolio Review">
                <c-fund-review></c-fund-review>
            </lightning-tab>
        </lightning-tabset>
    </div>
</template>

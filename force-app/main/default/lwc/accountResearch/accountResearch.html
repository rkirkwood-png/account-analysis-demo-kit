<template>
    <div class="editorial-card">
        <template lwc:if={isLoading}>
            <div class="loading-state">
                <lightning-spinner alternative-text="Researching..." size="medium"></lightning-spinner>
                <p class="loading-text">Agentforce is researching this company...</p>
            </div>
        </template>

        <template lwc:elseif={result}>
            <div class="section-label">Investment Memo Builder</div>

            <div class="section-block">
                <h3 class="section-heading">Company Overview</h3>
                <p class="body-text">{result.overview}</p>
            </div>

            <div class="section-block">
                <h3 class="section-heading">Company Snapshot</h3>
                <div class="snapshot-grid">
                    <div class="snapshot-cell">
                        <p class="snapshot-label">Industry</p>
                        <p class="snapshot-value">{result.industry}</p>
                    </div>
                    <div class="snapshot-cell">
                        <p class="snapshot-label">Headquarters</p>
                        <p class="snapshot-value">{result.headquarters}</p>
                    </div>
                    <div class="snapshot-cell">
                        <p class="snapshot-label">Key Products/Services</p>
                        <p class="snapshot-value">{result.products}</p>
                    </div>
                    <div class="snapshot-cell">
                        <p class="snapshot-label">Target Market</p>
                        <p class="snapshot-value">{result.targetMarket}</p>
                    </div>
                </div>
                <div class="website-row">
                    <p class="snapshot-label">Website</p>
                    <a href={result.website} class="website-link" target="_blank" rel="noopener noreferrer">{result.website}</a>
                </div>
            </div>

            <div class="section-block">
                <h3 class="section-heading">Key Executives</h3>
                <template for:each={result.executives} for:item="exec">
                    <div key={exec} class="exec-row">
                        <span class="exec-avatar">{exec}</span>
                        <p class="exec-text">{exec}</p>
                    </div>
                </template>
            </div>
        </template>

        <template lwc:elseif={error}>
            <p class="error-text">{error}</p>
        </template>
    </div>
</template>

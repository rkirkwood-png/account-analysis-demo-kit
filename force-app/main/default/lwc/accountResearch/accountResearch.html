<template>
    <lightning-card>
        <div slot="title">
            <lightning-icon icon-name="utility:search" size="small" 
class="slds-m-right_small"></lightning-icon>
            Investment Memo Builder
        </div>

        <div class="slds-p-around_medium">
            <template lwc:if={isLoading}>
                <div class="slds-text-align_center slds-p-around_large">
                    <lightning-spinner alternative-text="Researching..." 
size="medium"></lightning-spinner>
                    <p class="slds-m-top_medium slds-text-color_weak">Agentforce is
researching this company...</p>
                </div>
            </template>

            <template lwc:elseif={result}>
                <div class="slds-m-bottom_medium">
                    <h3 class="slds-text-title_caps slds-m-bottom_small">Company Overview</h3>
                    <p>{result.overview}</p>
                </div>

                <div class="slds-m-bottom_medium">
                    <h3 class="slds-text-title_caps slds-m-bottom_small">Company
Snapshot</h3>
                    <div class="slds-grid slds-gutters slds-wrap">
                        <div class="slds-col slds-size_1-of-2 slds-m-bottom_small">
                            <p class="slds-text-color_weak">Industry</p>
                            <p>{result.industry}</p>
                        </div>
                        <div class="slds-col slds-size_1-of-2 slds-m-bottom_small">
                            <p class="slds-text-color_weak">Headquarters</p>
                            <p>{result.headquarters}</p>
                        </div>
                        <div class="slds-col slds-size_1-of-2 slds-m-bottom_small">
                            <p class="slds-text-color_weak">Key Products/Services</p>
                            <p>{result.products}</p>
                        </div>
                        <div class="slds-col slds-size_1-of-2 slds-m-bottom_small">
                            <p class="slds-text-color_weak">Target Market</p>
                            <p>{result.targetMarket}</p>
                        </div>
                        <div class="slds-col slds-size_1-of-2 slds-m-bottom_small">
                            <p class="slds-text-color_weak">Website</p>
                            <p>{result.website}</p>
                        </div>
                    </div>
                </div>

                <div class="slds-m-bottom_medium">
                    <h3 class="slds-text-title_caps slds-m-bottom_small">Key Executives</h3>
                    <template for:each={result.executives} for:item="exec">
                        <p key={exec} class="slds-m-bottom_x-small">• {exec}</p>
                    </template>
                </div>

            </template>

            <template lwc:elseif={error}>
                <p class="slds-text-color_error">{error}</p>
            </template>
        </div>
    </lightning-card>
</template>

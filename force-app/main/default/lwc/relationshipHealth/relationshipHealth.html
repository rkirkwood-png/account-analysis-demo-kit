
<template>
    <div class="editorial-card">
        <template lwc:if={isLoading}>
            <div class="loading-state">
                <lightning-spinner alternative-text="Analyzing..." size="medium"></lightning-spinner>
                <p class="loading-text">Agentforce is analyzing your Salesforce data...</p>
            </div>
        </template>

        <template lwc:elseif={result}>
            <div class="section-label">Deal Execution Risk</div>

            <div class="score-header">
                <div class="score-ring-wrap">
                    <svg class="score-ring" viewBox="0 0 120 120" aria-hidden="true">
                        <circle class="score-ring-bg" cx="60" cy="60" r="45"></circle>
                        <circle class="score-ring-progress" cx="60" cy="60" r="45" style={scoreRingStyle}></circle>
                    </svg>
                    <div class="score-value">{result.score}</div>
                </div>
                <div class="score-side">
                    <div class="score-caption">Deal Conviction Score</div>
                    <div class="status-badge">{result.status}</div>
                </div>
            </div>

            <div class="detail-grid">
                <div class="detail-item">
                    <p class="detail-label">Trend</p>
                    <p class="detail-value">{result.trend}</p>
                </div>
                <div class="detail-item">
                    <p class="detail-label">Likelihood to Close</p>
                    <p class="detail-value">{result.renewalLikelihood}</p>
                </div>
            </div>

            <div class="section-block">
                <h3 class="section-heading">Key Insights</h3>
                <template for:each={result.insights} for:item="insight">
                    <p key={insight} class="insight-line">• {insight}</p>
                </template>
            </div>

            <div class="slds-m-top_medium">
                <p class="section-label">Meeting Summaries To Date</p>
                <template lwc:if={meetingsLoading}>
                    <div class="slds-text-align_center slds-p-around_small">
                        <lightning-spinner size="small" alternative-text="Loading..."></lightning-spinner>
                    </div>
                </template>
                <template lwc:elseif={hasMeetingSummaries}>
                    <template lwc:if={meetingSummaries.intro}>
                        <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_small">{meetingSummaries.intro}</p>
                    </template>
                    <template for:each={meetingSummaries.meetings} for:item="meeting">
                        <div key={meeting.id} class="action-item slds-m-bottom_x-small">
                            <p class="slds-text-body_small">
                                <span style="font-size:16px; margin-right:8px;">{meeting.emoji}</span>{meeting.text}
                            </p>
                        </div>
                    </template>
                </template>
                <template lwc:else>
                    <p class="slds-text-body_small slds-text-color_weak">No meeting summaries available.</p>
                </template>
            </div>
        </template>

        <template lwc:elseif={error}>
            <p class="error-text">{error}</p>
        </template>
    </div>
</template>
